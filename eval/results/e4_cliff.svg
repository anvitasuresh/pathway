<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Recall of hard positives across rewordings</title>
<desc id="d">Share of hard positives routed to review or above, and of hard negatives routed to review or above, for the original conversations and each rewording. Whiskers are Wilson 95% intervals.</desc>
