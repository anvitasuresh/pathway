<line x1="105.0" x2="105.0" y1="212.2" y2="64.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<circle cx="105.0" cy="64.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>original, hard positives: 3/3 (95% CI 43-100%)</title></circle>
